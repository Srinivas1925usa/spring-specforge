# src/main/resources/application.properties
spring.application.name=spring-specforge

# H2 Database Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:springspecforge_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop # Automatically creates schema, drops on shutdown. Use 'update' for production.
spring.jpa.show-sql=true # Log SQL statements
spring.jpa.properties.hibernate.format_sql=true # Format SQL for readability

# Data initialization for H2 - finds data.sql in classpath
spring.sql.init.mode=always