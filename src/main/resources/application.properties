# src/main/resources/application.properties
spring.application.name=spring-specforge

# H2 Database Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# In-memory DB (shared while the app is running). DB_CLOSE_DELAY=-1 keeps it alive.
spring.datasource.url=jdbc:h2:mem:springspecforge_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# When logging into http://localhost:8080/h2-console use:
#   JDBC URL:  jdbc:h2:mem:springspecforge_db
#   User Name: sa
#   Password:  password
# Do NOT use the default jdbc:h2:~/test (that looks for a file at ~/test).

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Automatically creates schema, drops on shutdown. Use 'update' for production.
spring.jpa.hibernate.ddl-auto=create-drop
# Log SQL statements
spring.jpa.show-sql=true
# Format SQL for readability
spring.jpa.properties.hibernate.format_sql=true

# Run data.sql AFTER Hibernate creates the schema (required with ddl-auto=create-*)
# Without this, Hibernate recreate-drops the tables and wipes any earlier inserts.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
