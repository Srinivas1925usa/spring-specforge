# src/main/resources/application.properties
# H2 Database configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:mydatabase;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA/Hibernate configuration
# 'update' mode will create tables and relationships if they don't exist
# and update schema if entities change. Use 'create-drop' for fresh schema on each restart.
# For production, consider 'validate' and dedicated migration tools (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Data initialization for H2 (only runs if ddl-auto is 'create', 'create-drop' or 'update')
# These commands will be executed on startup if spring.sql.init.mode is 'always'.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:import.sql

# Spring JPA open-in-view configuration
# Setting to false is generally recommended to prevent LazyInitializationException
# outside of transactional boundaries and manage transaction scope explicitly.
# For `@EntityGraph` and `@Transactional(readOnly=true)` on service methods, this is typically handled.
spring.jpa.open-in-view=false